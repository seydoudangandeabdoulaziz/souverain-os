# ============================================================
# Brique 1 — PostgreSQL / TimescaleDB multi-tenant
# ============================================================
# Dépendances ISOLÉES de cette brique (workspace uv, Option A).
# ============================================================

[project]
name = "brique-01-postgresql"
version = "0.1.0"
description = "SOUVERAIN-OS — Brique 1 : schéma PostgreSQL/TimescaleDB multi-tenant (schema-per-tenant)"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "asyncpg>=0.29.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
]

[project.scripts]
souverain-tenant-creer = "brique_01_postgresql.cli:main_creer"
souverain-tenant-activer = "brique_01_postgresql.cli:main_activer"
souverain-tenant-desactiver = "brique_01_postgresql.cli:main_desactiver"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.9",
    "mypy>=1.11.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/brique_01_postgresql"]
artifacts = ["*.sql", "py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

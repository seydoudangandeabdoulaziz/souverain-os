# ============================================================
# Brique 2 — Auth / RBAC minimal + fondations SOUVERAIN-ID
# ============================================================
# Dépendances ISOLÉES de cette brique (workspace uv, Option A),
# avec une dépendance INTERNE explicite vers la Brique 1
# (réutilise le pool de connexions PostgreSQL déjà validé).
# ============================================================

[project]
name = "brique-02-auth-rbac"
version = "0.1.0"
description = "SOUVERAIN-OS — Brique 2 : authentification, RBAC minimal, fondations SOUVERAIN-ID"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "brique-01-postgresql",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.9.0",
    "fastapi>=0.115.0",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.9",
    "mypy>=1.11.2",
]

[tool.uv.sources]
brique-01-postgresql = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/brique_02_auth_rbac"]
artifacts = ["*.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "jwt.*"
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>{{ t('login.titre') }} — {{ t('app.titre') }}</title>
    <link rel="stylesheet" href="/static/souverain.css">
</head>
<body class="page-connexion">
    <form class="carte-connexion" method="post" action="/login">
        <h1>{{ t('login.titre') }}</h1>
        {% if erreur %}
        <p class="erreur">{{ t(erreur) }}</p>
        {% endif %}
        <label>{{ t('login.email') }}
            <input type="email" name="email" required autofocus>
        </label>
        <label>{{ t('login.mot_de_passe') }}
            <input type="password" name="mot_de_passe" required>
        </label>
        <button type="submit">{{ t('login.bouton') }}</button>
    </form>
</body>
</html>

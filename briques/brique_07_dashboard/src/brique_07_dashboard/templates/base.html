<!DOCTYPE html>
<html lang="{{ langue|default('fr') }}">
<head>
    <meta charset="utf-8">
    <title>{{ t('app.titre', langue|default('fr')) }}</title>
    <script src="/static/htmx.min.js"></script>
    <link rel="stylesheet" href="/static/souverain.css">
</head>
<body>
    <nav>
        <a href="/alertes"{% if request.url.path.startswith('/alertes') %} class="actif"{% endif %}>{{ t('nav.alertes', langue|default('fr')) }}</a>
        <div class="nav-droite">
            {% if role %}<span class="badge badge-role">{{ role }}</span>{% endif %}
            <form action="/logout" method="post" style="margin:0">
                <button type="submit">{{ t('nav.deconnexion', langue|default('fr')) }}</button>
            </form>
        </div>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>

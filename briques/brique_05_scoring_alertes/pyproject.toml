# ============================================================
# Brique 5 — Scoring + Alertes
# ============================================================
[project]
name = "brique-05-scoring-alertes"
version = "0.1.0"
description = "SOUVERAIN-OS — Brique 5 : agrégation des détections en score de risque par compte, et déclenchement d'alertes"
requires-python = ">=3.12"
dependencies = [
    "brique-01-postgresql",
    "asyncpg>=0.29",
    "pydantic-settings>=2.4",
]

[tool.uv.sources]
brique-01-postgresql = { workspace = true }
# Dépendance de TEST uniquement (voir dependency-groups.dev) : réutilise
# regles_par_defaut()/detecter_sequentiellement() de la Brique 4 pour
# générer de vraies détections en mémoire dans les tests d'intégration.
# Jamais importée par le code runtime (lecture.py, agregation.py,
# persistence.py, cli.py) — même principe que Brique 4 → Brique 3.
brique-04-detection = { workspace = true }

[project.scripts]
souverain-scorer = "brique_05_scoring_alertes.cli:main"

[dependency-groups]
dev = [
    "brique-04-detection",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brique_05_scoring_alertes"]
artifacts = ["*.sql", "py.typed"]

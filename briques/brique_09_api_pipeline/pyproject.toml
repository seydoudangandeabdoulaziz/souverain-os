# ============================================================
# Brique 9 — API d'ingestion/scoring (identité technique par tenant)
# ============================================================
# Dépendances RUNTIME vers B1 (pools), B2 (hachage Argon2id uniquement),
# B4 (moteur de détection, sans sa persistance) et B5 (scoring/alertes).
# Aucune de ces briques n'est modifiée. « Brique 9 » désigne ce paquet
# fonctionnel, sans rapport avec l'« étape 9 » (Redis/Celery, non requise).
# ============================================================
[project]
name = "brique-09-api-pipeline"
version = "0.1.0"
description = "SOUVERAIN-OS — Brique 9 : API d'ingestion et de scoring par identité technique"
requires-python = ">=3.12"
dependencies = [
    "brique-01-postgresql",
    "brique-02-auth-rbac",
    "brique-04-detection",
    "brique-05-scoring-alertes",
    "fastapi>=0.115.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.5.0",
    "pyjwt>=2.9.0",
    "asyncpg>=0.29.0",
]

[tool.uv.sources]
brique-01-postgresql = { workspace = true }
brique-02-auth-rbac = { workspace = true }
brique-04-detection = { workspace = true }
brique-05-scoring-alertes = { workspace = true }
souverain-generateur = { workspace = true }

[project.scripts]
souverain-api-provisionner = "brique_09_api_pipeline.cli:main_provisionner"
souverain-api-client = "brique_09_api_pipeline.cli:main_client"

[dependency-groups]
dev = [
    "souverain-generateur",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# La Brique 2 n'a pas de py.typed : contournement local (décision pendante
# du fondateur, voir la roadmap), sans toucher à la Brique 2.
module = "brique_02_auth_rbac.*"
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brique_09_api_pipeline"]
artifacts = ["py.typed"]

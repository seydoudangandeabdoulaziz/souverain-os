# ============================================================
# Brique 3 — Générateur + ingestion de transactions synthétiques
# ============================================================
# CORRECTIF : ajoute la dépendance workspace vers brique-01-postgresql
# (réutilisation de PostgresSettings, create_pool/close_pool,
# validate_schema_name — au lieu de les redupliquer).
# ============================================================

[project]
name = "souverain-generateur"
version = "0.1.0"
description = "SOUVERAIN-OS — Brique 3 : générateur + ingestion de transactions synthétiques"
requires-python = ">=3.12"
dependencies = [
    "brique-01-postgresql",
    "asyncpg>=0.29",
    "pydantic-settings>=2.4",
]

[tool.uv.sources]
brique-01-postgresql = { workspace = true }

[project.scripts]
souverain-generer = "souverain_generateur.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/souverain_generateur"]
artifacts = ["*.sql"]

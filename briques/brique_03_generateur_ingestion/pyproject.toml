[project]
name = "souverain-generateur"
version = "0.1.0"
description = "SOUVERAIN-OS — Brique 3 : générateur + ingestion de transactions synthétiques"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.29",
    "pydantic-settings>=2.4",
]

[project.scripts]
souverain-generer = "souverain_generateur.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/souverain_generateur"]

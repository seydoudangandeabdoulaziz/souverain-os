# ============================================================
# SOUVERAIN-OS — Docker Compose SOCLE
# ============================================================
# Brique 0 : AUCUN service métier n'est démarré ici.
# Ce fichier utilise des "profiles" Docker Compose : chaque
# groupe de services futur sera activé uniquement quand sa
# brique sera implémentée, via --profile <nom>.
#
# Exemple futur (Brique 1) :
#   docker compose --profile postgres up
#
# Aujourd'hui : `docker compose up` ne lance rien (normal).
# ============================================================

name: souverain-os

services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-souverain_os}
      POSTGRES_USER: ${POSTGRES_USER:-souverain_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-souverain_admin}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - souverain-net

# ------------------------------------------------------------
# Emplacements réservés pour les futurs services, par profile :
#
#   profiles: ["neo4j"]      -> Brique 6 (Neo4j)
#   profiles: ["redis"]      -> Phase transverse (Redis/Celery)
#   profiles: ["ollama"]     -> Phase transverse (Ollama/Mistral)
#   profiles: ["monitoring"] -> Phase transverse (Prometheus/Grafana)
#
# Chaque service sera ajouté explicitement, brique par brique,
# jamais anticipé.
# ------------------------------------------------------------

volumes:
  postgres_data:

networks:
  souverain-net:
    driver: bridge

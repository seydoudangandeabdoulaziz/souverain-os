[project]
name = "souverain-rag"
version = "0.1.0"
description = "Recherche documentaire locale et sourcée pour SOUVERAIN-OS"
requires-python = ">=3.12"
dependencies = [
    "pypdf>=6.0,<7.0",
    "chromadb-client>=1.5.9,<2.0",
    "torch>=2.14.1,<3.0",
    "transformers>=5.22.2,<6.0",
]

[project.scripts]
souverain-rag = "souverain_rag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/souverain_rag"]
artifacts = ["py.typed"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
